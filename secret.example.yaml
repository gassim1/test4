# Do NOT commit real values. Copy to secret.yaml (git-ignored) or create with:
#   kubectl -n ofintech-dask create secret generic ofintech-dask-secrets --from-env-file=.env.secrets
apiVersion: v1
kind: Secret
metadata:
  name: ofintech-dask-secrets
  namespace: ofintech-dask
type: Opaque
stringData:
  # TODO: match the real variable names in the repo
  SESSION_SECRET: "change-me"
  SMTP_USER: "change-me"
  SMTP_PASSWORD: "change-me"
  GOOGLE_CLIENT_ID: "change-me"
  GOOGLE_CLIENT_SECRET: "change-me"
  # Add your LLM/API key and database URL here if the app uses them
